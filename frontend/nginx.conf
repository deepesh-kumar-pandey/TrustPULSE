# ============================================================
# nginx.conf — Custom Nginx config for React SPA
# ============================================================
# This config is CRITICAL for React Router to work correctly.
# Without it, navigating directly to /dashboard returns a 404
# because nginx tries to find a physical file at that path.
#
# The "try_files" directive tells nginx:
#   1. Try to serve the exact file requested
#   2. Try to serve it as a directory
#   3. Fall back to /index.html (let React Router handle it)
# ============================================================

server {
    listen 80;
    server_name localhost;

    # Root directory for static files (Vite build output)
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    # In Docker Compose, "backend" is the service name
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
