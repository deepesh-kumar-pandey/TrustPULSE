# ============================================================
# docker-compose.yml — TrustPULSE Full Stack Orchestration
# ============================================================
#
# Services:
#   mongodb  — Official MongoDB 7 image
#   backend  — Node.js + Express API (port 5000)
#   frontend — React app served via Nginx (port 3000)
#
# Run with:
#   docker-compose up --build
#
# Stop with:
#   docker-compose down
#
# Stop and remove volumes (wipes DB):
#   docker-compose down -v
# ============================================================

version: '3.9'

services:

  # ── MongoDB ──────────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: trustpulse-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'           # Expose for local tools like MongoDB Compass
    volumes:
      - mongodb_data:/data/db   # Persist data between restarts
    environment:
      MONGO_INITDB_DATABASE: trustpulse
    networks:
      - trustpulse-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Backend (Express API) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustpulse-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/trustpulse
      - NODE_ENV=production
      - CACHE_DURATION_HOURS=24
    depends_on:
      mongodb:
        condition: service_healthy   # Wait for MongoDB to be ready
    networks:
      - trustpulse-network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend (React + Nginx) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustpulse-frontend
    restart: unless-stopped
    ports:
      - '3000:80'               # nginx listens on 80, mapped to host port 3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trustpulse-network

# ── Named Volumes ────────────────────────────────────────────
volumes:
  mongodb_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────
networks:
  trustpulse-network:
    driver: bridge
